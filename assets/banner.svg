    <path d="M830 266V258H834V266H830ZM837 266V254H841V266H837ZM844 266V250H848V266H844Z" fill="#F2F2F2"/>
    <text x="874" y="267" fill="#151515" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="820">My Trading Desk</text>
    <path d="M1062 262H1078C1081.31 262 1084 264.686 1084 268V277H1056V268C1056 264.686 1058.69 262 1062 262Z" fill="#5F5F5F"/>
    <path d="M1063 262V255C1063 251.134 1066.13 248 1070 248C1073.87 248 1077 251.134 1077 255V262" stroke="#5F5F5F" stroke-width="4" stroke-linecap="round"/>
    <path d="M1095 253L1109 267M1109 253L1095 267" stroke="#5F5F5F" stroke-width="4" stroke-linecap="round"/>
